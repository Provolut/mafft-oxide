name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: pre-push gates
    runs-on: ubuntu-24.04
    # Coverage runs unoptimised, instrumented test binaries under Intel SDE,
    # and SDE's speed depends on the host CPU: the same commit took 8 minutes
    # of coverage on one hosted runner and 36 on another, which hit a 45-minute
    # limit after every gate had passed.
    timeout-minutes: 90
    steps:
      # Hosted VMs are discarded after the job and the log does not name the
      # CPU, so record it here: a slow run can then be told apart from a slow
      # machine.
      - name: Runner
        run: |
          echo "runner:  $RUNNER_NAME ($RUNNER_ENVIRONMENT, $RUNNER_OS/$RUNNER_ARCH)"
          echo "user:    $(id -un) (uid $(id -u)); triggered by $GITHUB_ACTOR"
          echo "host:    $(hostname)"
          echo "cpu:     $(sed -n 's/^model name[[:space:]]*: //p' /proc/cpuinfo | head -1)"
          echo "cores:   $(nproc)"
          echo "memory:  $(awk '/^MemTotal:/ {printf "%.1f GiB", $2/1048576}' /proc/meminfo)"
          echo "avx512f: $(grep -qw avx512f /proc/cpuinfo && echo yes || echo no)"

      - uses: actions/checkout@v5

      # Pinned to the toolchain the committed measurements were made with, so a
      # new stable release cannot move the coverage number or the timings under
      # the gate without a commit saying so.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # The hosted runners have no AVX-512, so without this the kernels in
      # lalign_avx512.rs and partalign_avx512.rs never execute here: they are
      # neither checked for identical output nor counted by the coverage floor,
      # which then reads 87.64% instead of the ~91% it measures on AVX-512
      # hardware. Intel SDE emulates a Skylake-X CPU (AVX-512F and VL, what the
      # kernels need) for the test binaries cargo runs and for the programs
      # those tests launch. Downloaded from Intel, not a mirror, and pinned by
      # hash.
      #
      # Every test binary runs under SDE except one: the debug build of
      # tests/matrix.rs, which only bench/coverage.sh runs (the hook's own
      # `cargo test` is --release). It launches a process per case, SDE costs
      # each one a start-up, and it was 87% of the emulated time: 249 s of 287
      # on an AVX-512 machine, far more on a hosted runner. Nothing is lost by
      # running it natively:
      # - the release build of matrix.rs, the same 553 C-derived cases, still
      #   runs under SDE, so the kernels' output is still checked byte for byte;
      # - kernel coverage comes from the unit tests in lalign_avx512.rs and
      #   partalign_avx512.rs (98.97% and 98.72% on their own); with the debug
      #   matrix native, both files and the total measure what they did with it
      #   emulated, to within the one line that takes the non-AVX-512 branch.
      # It also gains something: the scalar path the kernels replace is now
      # compared against the C's bytes here, which no AVX-512 machine does.
      - name: Intel SDE (emulated AVX-512)
        env:
          SDE_URL: https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-lin.tar.xz
          SDE_SHA256: 94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50
        run: |
          curl -sSfL -o "$RUNNER_TEMP/sde.tar.xz" "$SDE_URL"
          echo "$SDE_SHA256  $RUNNER_TEMP/sde.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/sde"
          tar xJf "$RUNNER_TEMP/sde.tar.xz" -C "$RUNNER_TEMP/sde" --strip-components=1
          cat > "$RUNNER_TEMP/test-runner" <<'EOF'
          #!/bin/sh
          case "$1" in
            */debug/deps/matrix-*) exec "$@" ;;
            *) exec "$RUNNER_TEMP/sde/sde64" -skx -- "$@" ;;
          esac
          EOF
          chmod +x "$RUNNER_TEMP/test-runner"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER=$RUNNER_TEMP/test-runner" >> "$GITHUB_ENV"

      # The same script as the local hook, not a copy of its steps: the tests,
      # the coverage floor and the encoding check live in one place and cannot
      # drift apart. With stdin empty it checks the checkout rather than a list
      # of pushed refs. The golden replays need a store recorded against a
      # built core/, which is not tracked, so here they report that they did
      # not run; the differential harnesses stay a local, hour-long gate.
      - name: .githooks/pre-push
        run: .githooks/pre-push < /dev/null

      - name: cargo publish --dry-run
        working-directory: rust
        run: cargo publish --dry-run
