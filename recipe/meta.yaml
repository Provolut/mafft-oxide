{% set version = "0.3.0" %}
{% set mafft_version = "7.526" %}

package:
  name: mafft-oxide
  version: {{ version }}

source:
  # A clone of the committed tree, not `path: ..`, which would copy
  # `rust/target/` -- several GB of build output -- into the work directory.
  # For a release build, replace this with the tagged tarball and its sha256.
  git_url: ..
  git_rev: HEAD

build:
  # Bumped on every content change, because rattler and conda cache by
  # filename: shipping different contents under one build string hands
  # whoever installs next whichever copy landed first. 0 -> 1 was the
  # self-locating driver and `f2cl-rs`'s clustal and phylip writers; 1 -> 2 is
  # the driver's baked literal prefix (see recipe/build.sh). The version
  # change reset this to 0; 0 -> 1 is the corrected `about.description`, which
  # had still described the driver as self-locating and the substitution as a
  # single `sed`. A 0 had already been built by then, so it gets a new number
  # rather than new contents under the same filename -- the rule above,
  # applied to myself.
  number: 1
  # The driver is a POSIX shell script and the components are built with
  # conda's unix rust toolchain. `__unix` as a run dependency expressed this
  # too, but a skip is what conda-forge's build matrix reads.
  skip: true  # [win]
  # `build.sh` next to this file is picked up automatically; naming it in a
  # `script:` key as well is an error ("Found a build.sh script and a
  # build/script section inside meta.yaml").
  #
  # No `activate.d` script and no `MAFFT_BINARIES`: see recipe/build.sh for why
  # an environment-wide export of that variable is a correctness hazard rather
  # than a convenience.

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('c') }}        # cargo needs a linker
    - {{ stdlib('c') }}          # required alongside a compiler
    - cargo-bundle-licenses      # writes THIRDPARTY.yml, listed below
  # No `run:` section at all. The driver is a POSIX shell script whose only
  # external commands are cat awk grep tr head sed wc mktemp basename uname
  # tail sort dirname -- all coreutils/busybox-level -- and both `perl`
  # references in the template are commented out. The nine components are
  # static but for libc, which the compiler's own run-export pins. So there is
  # nothing left to declare.

test:
  files:
    - test_pkg.sh
  commands:
    - bash test_pkg.sh

about:
  home: https://github.com/Provolut/mafft-oxide
  license: BSD-3-Clause
  license_family: BSD
  # Resolved against the extracted source, not against this directory: a
  # `../LICENSE` works here only because conda-build also searches the recipe
  # dir, and in a feedstock layout that path is the feedstock root instead.
  #
  # `licenses/MAFFT` ships because this package redistributes `core/mafft.tmpl`
  # essentially verbatim -- 3069 of 3070 lines, still declaring
  # `version="v7.526"` -- so Katoh's licence applies to what is installed, not
  # merely to what it was derived from. `licenses/MAFFT-extensions` is
  # deliberately *not* here: its Vienna RNA and MXSCARNA terms forbid
  # redistribution for a fee, and shipping that text would assert those terms
  # over a package containing nothing from `extensions/`. Checked rather than
  # assumed -- no file under `rust/src/` derives from it.
  license_file:
    - LICENSE
    - licenses/MAFFT
    - THIRDPARTY.yml
  summary: Bit-exact Rust port of MAFFT's alignment components, with the upstream driver
  description: |
    mafft-oxide is a Rust port of the numerical core of MAFFT {{ mafft_version }},
    verified byte-identical against the unmodified upstream C build rather than
    argued to be equivalent.

    This package installs the nine ported components into a private libexec
    under the names MAFFT's driver calls them by, and ships the upstream
    `mafft` driver as **`mafft-oxide`**: `core/mafft.tmpl` with its `_LIBDIR`
    placeholder resolved the way the upstream Makefile resolves it, plus one
    added fallback line. 3070 lines out of 3069 in, and nothing else changed.

    The launcher sets no environment variable. Its component directory is
    baked in as a literal path and rewritten at install time -- the same
    mechanism the conda-forge `mafft` package uses -- so a tool that inspects
    the driver can read which components it will run instead of having to
    evaluate shell. If that directory is ever missing, which is what a copied
    or relocated environment leaves behind, the launcher works the directory
    out from its own location rather than silently running another
    installation's binaries. `MAFFT_BINARIES` overrides both when it is set,
    which is what lets this package be compared against another build. A
    conda-forge `mafft` in the same environment is untouched and remains
    genuinely stock, so the two can be compared against each other.

    Supported envelope. The nine components cover `mafft --auto` for inputs up
    to 20,000 sequences, which is every branch of the driver's strategy table
    that does not need an unported binary. Outside that envelope the launcher
    exits non-zero naming the missing component rather than producing a
    different alignment:

      * `--allowshift` with iterations: `dvtditr-rs` refuses the specificity
        scoring path.
      * `--dash`: `f2cl-rs` refuses `-d`, which excludes records and re-picks
        common gaps -- a change to the alignment rather than to its format.
      * `--parttree`, and inputs past 20,000 sequences: these need
        `splittbfast`, which is not ported.

    FASTA, clustal (`--clustalout`) and phylip (`--phylipout`) output are all
    verified byte-identical to the C.

    Use the stock `mafft` for those. Nothing in this package degrades silently.
  doc_url: https://github.com/Provolut/mafft-oxide/blob/main/rust/README.md

extra:
  recipe-maintainers:
    - ingmarschuster
