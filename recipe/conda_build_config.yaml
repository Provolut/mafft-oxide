# What conda-forge's global pinning supplies and a bare `conda-build` does not.
#
# `{{ stdlib('c') }}` in meta.yaml expands to `c_{{ target_platform }}`, which
# is a *key* into this mapping rather than a package name. Inside a
# conda-forge feedstock the pinning repo defines it; outside one, the
# expansion reaches the solver verbatim and fails with
# `c_linux-64 does not exist`. These are conda-forge's own values, so the
# recipe resolves identically here and there rather than only there.
c_stdlib:
  - sysroot                      # [linux]
  - macosx_deployment_target     # [osx]
c_stdlib_version:
  - "2.17"                       # [linux]
  - "10.13"                      # [osx]
