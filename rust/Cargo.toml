[package]
name = "mafft-rs"
version = "0.2.0"
edition = "2021"
description = "Bit-exact Rust port of MAFFT's multiple-sequence-alignment algorithms"
license = "BSD-3-Clause"

[lib]
name = "mafft_rs"
path = "src/lib.rs"

[[bin]]
name = "dvtditr-rs"
path = "src/bin/dvtditr.rs"

[[bin]]
name = "disttbfast-rs"
path = "src/bin/disttbfast.rs"

[[bin]]
name = "tbfast-rs"
path = "src/bin/tbfast.rs"

[[bin]]
name = "countlen-rs"
path = "src/bin/countlen.rs"

[[bin]]
name = "version-rs"
path = "src/bin/version.rs"

[[bin]]
name = "replaceu-rs"
path = "src/bin/replaceu.rs"

[[bin]]
name = "f2cl-rs"
path = "src/bin/f2cl.rs"

[[bin]]
name = "restoreu-rs"
path = "src/bin/restoreu.rs"

[[bin]]
name = "dndpre-rs"
path = "src/bin/dndpre.rs"

[profile.release]
opt-level = 3
debug = false
lto = "fat"
codegen-units = 1
panic = "abort"

# Release codegen plus line tables, so callgrind can attribute instructions to
# source lines -- which is where every optimisation in GOAL.md section 3 came
# from. Kept separate from `release` because the debug sections add about
# 750 KB to the mapped binary, and on the small cases in the profiling
# database that is a large enough share of peak RSS to move the memory metric
# by several points. `bench/hotspots.sh` builds this; `bench/profile.sh`
# measures the real release build.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
