[package]
name = "mafft-rs"
version = "0.2.0"
edition = "2021"
description = "Bit-exact Rust port of MAFFT's multiple-sequence-alignment algorithms"
license = "BSD-3-Clause"

[lib]
name = "mafft_rs"
path = "src/lib.rs"

[[bin]]
name = "disttbfast-rs"
path = "src/bin/disttbfast.rs"

[[bin]]
name = "tbfast-rs"
path = "src/bin/tbfast.rs"

[profile.release]
opt-level = 3
# Line tables only: no effect on codegen or speed, but callgrind can then
# attribute instructions to source lines, which is what `bench/hotspots.sh`
# and every optimisation in GOAL.md section 3 depend on.
debug = "line-tables-only"
lto = "fat"
codegen-units = 1
panic = "abort"
